    <div *ngIf="isMenu">
        <p-splitter [panelSizes]="[15, 85]" [minSizes]="[15, 85]" styleClass="mb-5" >
            <ng-template pTemplate>
                <div>
                    <app-sidebar></app-sidebar>
                </div>
            </ng-template>
            <ng-template pTemplate>
                <div class="layout-main-container" class="container">
                    <div class="layout-main main-body">
                        <router-outlet></router-outlet>
                    </div>
                </div>
            </ng-template>
        </p-splitter>
    </div>
    <!-- TODO al div ponerle los grid de md, lg ... y tambien modificar el valor de isMenu si correspondirea al cerrar automaticamente -->
    <div *ngIf="!isMenu">
        <div class="layout-main-container" class="container">
            <div class="layout-main main-body">
                <router-outlet></router-outlet>
            </div>
        </div>
    </div>
    <app-footer></app-footer>
</div>
