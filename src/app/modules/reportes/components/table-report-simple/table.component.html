<!-- Reporte 1 simple, reportes 1,2,4,5 -->
<p-table *ngIf="componenteVisible" [columns]="cols" [value]="reporte" [tableStyle]="{'min-width': '50rem'}" width="100%"
class="custom-p-table">
<ng-template pTemplate="caption">
  <p-button icon="pi pi-fw pi-file-excel" (click)="descargaArchivo()" [rounded]="true" [text]="true"
    [raised]="true" severity="success">
  </p-button> &nbsp;
  <label (click)="descargaArchivo()"><b>Descargar {{numeroReporte}} de {{rangoFechas.initialDate}} a {{rangoFechas.finalDate}}</b></label>
</ng-template>
<ng-template pTemplate="header" let-columns>
  <tr>
    <th *ngFor="let col of columns">
      {{ col.header }}
    </th>
  </tr>
</ng-template>
<ng-template pTemplate="body" let-rowData let-columns="columns">
  <tr>
    <td *ngFor="let col of columns" [class]="[col.field == 'amount' || col.field == 'monto'?'numero' : 'normal']">

      <div *ngIf="col.field != 'amount' && col.field != 'monto' && col.field != 'finisheAt' && col.field != 'staredChargingAt'">
        {{rowData[col.field]}}
      </div>

      <div *ngIf="col.field == 'amount' || col.field == 'monto'">
        {{ rowData[col.field] | numberDecimal:2}}
      </div>

      <div *ngIf="col.field === 'finisheAt' || col.field === 'staredChargingAt'">
        {{ rowData[col.field] | formatFieldDateTime}}
      </div>
    </td>
  </tr>
</ng-template>
</p-table>
<!-- Reporte 1 simple, reportes 1,2,4,5 -->
