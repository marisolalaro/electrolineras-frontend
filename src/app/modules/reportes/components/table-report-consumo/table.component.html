<!-- Reporte simple, reportes 1,2,4,5 -->
<p-table *ngIf="componenteVisible" [columns]="cols" [value]="reporte" [tableStyle]="{'min-width': '50rem'}" width="100%"
class="custom-p-table">
<ng-template pTemplate="caption">
  <div class="grid">
      <div class="col-fixed" style="width:10%">
        <div class="text-center p-0 border-round-sm font-bold">
          <p-button
            label="Descargar"
            icon="pi pi-fw pi-file-excel"
            (click)="descargaArchivo()"
            size="small"
            [outlined]="true"
          />
        </div>
      </div>
      <div class="col">
          <div class="text-center p-0 border-round-sm font-bold">
            <label><b>{{ numeroReporte }}</b></label>
          </div>
      </div>
  </div>
</ng-template>
<ng-template pTemplate="header" let-columns>
  <tr>
    <th *ngFor="let col of columns">
      {{ col.header }}
    </th>
  </tr>
</ng-template>
<ng-template pTemplate="body" let-rowData let-columns="columns">
  <tr>
    <td *ngFor="let col of columns">
      <div *ngIf="col.field != 'modoDeCarga'" >
        {{rowData[col.field]}}
      </div>
      <div *ngIf="col.field === 'modoDeCarga'">
          {{ rowData[col.field] | mapeaModoCarga}}
      </div>
    </td>
  </tr>
</ng-template>
</p-table>
<!-- Reporte simple, reportes 1,2,4,5 -->
