<p-table
  responsiveLayout="stack"
  *ngIf="componenteVisible"
  [columns]="cols6"
  [value]="reporte"
  [tableStyle]="{ 'min-width': '50rem' }"
  width="100%"
  class="custom-p-table"
>
  <ng-template pTemplate="caption">
    <label
      ><b>{{ numeroReporte }}</b></label
    >
    <br />
    <br />
    <p-button
      label="Descargar"
      icon="pi pi-fw pi-file-excel"
      (click)="descargaArchivo()"
      size="small"
      [outlined]="true"
    />
  </ng-template>
</p-table>
