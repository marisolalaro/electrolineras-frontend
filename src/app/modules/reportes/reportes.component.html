<div class="container">
  <p-blockUI [blocked]="blockedPanel">
    <!-- <i class="pi pi-lock" style="font-size: 3rem"></i> -->
    <i class="pi pi-spin pi-spinner" style="font-size: 3rem; color: var(--primary-color)"></i>
  </p-blockUI>

  <div class="card">

    <div class="row">
      <h3><b>{{titleProduct.mainTitle}}</b></h3>
    </div>

    <div class="row">
      <p-card header="" subheader="">
        <ng-template pTemplate="header">
          <p-toolbar>
            <div class="p-toolbar-group-start">
              <p>Filtros</p>
            </div>
            <div class="p-toolbar-group-end">
            </div>
          </p-toolbar>
        </ng-template>
        <div class="form-group field">
          <label>Rango de fechas: &nbsp;</label>
          <p-calendar [(ngModel)]="rangeDates" selectionMode="range" [readonlyInput]="true" dateFormat="dd/mm/yy"
            [showIcon]="true"></p-calendar>
        </div>
        <!-- <ng-template pTemplate="footer">
          <p-button label="Filtrar" icon="pi pi-filter" [disabled]="rangeDates == undefined"></p-button>
          <p-button label="Cancel" icon="pi pi-times" styleClass="p-button-secondary"
            [style]="{ 'margin-left': '.5em' }"></p-button>
        </ng-template> -->
      </p-card>
    </div>
    <div class="row">
      <div class="col"></div>
    </div>
    <div class="row">
      <p-card>
        <ng-template pTemplate="header">
          <p-toolbar>
            <div class="p-toolbar-group-start">
              <p>Reportes</p>
            </div>
            <div class="p-toolbar-group-end">
            </div>
          </p-toolbar>
        </ng-template>

        <p-table [value]="reportes" [tableStyle]="{ 'min-width': '50rem' }" responsiveLayout="stack">
          <ng-template pTemplate="header">
            <tr>
              <th>Nombre Reporte</th>
              <th style="text-align:center; vertical-align:middle">Descargar</th>
            </tr>
          </ng-template>
          <ng-template pTemplate="body" let-reports>
            <tr>
              <td>{{ reports.nombre }}</td>
              <td style="text-align:center; vertical-align:middle">
                <p-button icon="pi pi-fw pi-file-excel" severity="success" [disabled]="rangeDates == undefined" [text]="true"
                (click)="onDownloadReport(reports.nombre )"></p-button>&nbsp;
              </td>
            </tr>
          </ng-template>
        </p-table>

      </p-card>
    </div>
    <div class="row">
      <div class="col"></div>
    </div>
  </div>
</div>

<p-toast></p-toast>
