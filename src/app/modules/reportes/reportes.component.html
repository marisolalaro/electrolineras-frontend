<div class="container p-2">
  <p-card>
    <div class="text-center mb-3 py-2 border-bottom-1 border-300">
      <h1 class="siat-title m-0">{{tituloComponente.mainTitle}}</h1>
      <p class="siat-subtitle m-0">Generación de Reportes Institucionales</p>
    </div>

    <div class="flex justify-content-center mb-4">
      <div class="p-3 border-round-xl shadow-1 bg-gray-50 flex align-items-center gap-3 border-1 border-200">
        <label class="font-bold text-700"><i class="pi pi-calendar mr-2"></i>Rango de fechas:</label>
        <p-calendar [(ngModel)]="rangeDates"
                    selectionMode="range"
                    [readonlyInput]="true"
                    dateFormat="dd/mm/yy"
                    [showIcon]="true"
                    placeholder="Seleccione un rango"
                    [style]="{'width':'280px'}">
        </p-calendar>
      </div>
    </div>

    <div class="grid justify-content-center">
      <div class="col-12 md:col-4 lg:col-3 p-3" *ngFor="let reporte of tiposReportes">
        
        <div class="report-card" 
             [class.report-active]="reporte === reporteActivoVisual"
             (click)="descargarDesdeCard(reporte)">
          
          <div class="report-image-container">
            <img [src]="reporte.imagen" 
                 [alt]="reporte.nombre"
                 onerror="this.src='assets/images/placeholder-report.jpg';">
            <div class="report-overlay">
              <i class="pi pi-download text-3xl text-white"></i>
            </div>
          </div>

          <div class="report-footer">
            <span class="report-name">{{reporte.nombre}}</span>
            <i class="pi pi-file-excel text-green-600 font-bold text-xl"></i>
          </div>
        </div>

      </div>
    </div>

  </p-card>
</div>
<p-toast></p-toast>
