<div class="container">
  <div class="card">

    <div class="row">
      <h3><b>{{tituloComponente.mainTitle}}</b></h3>
    </div>

    <div class="row">
      <p-card header="" subheader="">
        <ng-template pTemplate="header">
          <p-toolbar>
            <div class="p-toolbar-group-start">
              <p>Filtros</p>
            </div>
            <div class="p-toolbar-group-end">
            </div>
          </p-toolbar>
        </ng-template>
        <div class="form-group field">
          <div class="row">
            <div class="grid">
              <div class="col">
                <label>Rango de fechas: &nbsp;</label>
                <p-calendar [(ngModel)]="rangeDates" selectionMode="range" [readonlyInput]="true" dateFormat="dd/mm/yy"
                  [showIcon]="true"></p-calendar>
              </div>
              <div class="col">
                <label>Seleccione Reporte: &nbsp;</label>
                <p-autoComplete [(ngModel)]="reporteSeleccionado" [suggestions]="coincidenciasFiltro"
                  (completeMethod)="filtraReporte($event)" field="nombre" [dropdown]="true" placeholder="Buscar Reporte">
                </p-autoComplete>
              </div>
              <div class="col">
                <p-button label="Generar Vista Previa" icon="pi pi-filter"
                  [disabled]="rangeDates == undefined || !reporteSeleccionado" (click)="onAdicionaTabs()"></p-button>
              </div>
            </div>
          </div>
        </div>
      </p-card>
    </div>

    <div class="row">
      <div class="col"></div>
    </div>

    <div class="row">
      <p-card>
        <ng-template pTemplate="header">
          <p-toolbar>
            <div class="p-toolbar-group-start">
              <p>Vista Previa</p>
            </div>
            <div class="p-toolbar-group-end">
            </div>
          </p-toolbar>
        </ng-template>
      <div>      
        <p-tabView (onChange)="onTabChange($event)" [(activeIndex)]="activeIndex">
          <p-tabPanel *ngFor="let tab of tabs; let i = index"  [header]="tab.title" [closable]="true">
            <app-table-report-simple *ngIf="showReport == 'x reporte'" [rangoFechas]="tab.content" [tipoReporte]="reporteSeleccionado"></app-table-report-simple>
            <app-table-factura-relacionada *ngIf="showReport == '3er reporte'" [rangoFechas]="tab.content"></app-table-factura-relacionada>
            <app-table-transacciones-cliente *ngIf="showReport == '6to reporte' && componenteVisible" [rangoFechas]="tab.content"></app-table-transacciones-cliente>
            <app-table-suministro-cliente *ngIf="showReport == '7mo reporte' && componenteVisible" [rangoFechas]="tab.content" ></app-table-suministro-cliente>
          </p-tabPanel>
        </p-tabView>
      </div>
      </p-card>
    </div>
    <div class="row">
      <div class="col"></div>
    </div>
  </div>
</div>

<p-toast></p-toast>
