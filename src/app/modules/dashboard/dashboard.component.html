<div class="container">
  <p-card header="">
    <div class="row">
      <div class="grid">
        <div class="col-12 lg:col-6 xl:col-3" *ngFor="let item of electricStations">
          <p-card [header]="" subheader="" [style]="{ width: '360px' }">

            <span class="block align-center mb-4"><b>{{item.nameStation}}</b></span>
            <div class="row">
              <div class="grid">
                <div class="col-6" style="text-align: right;">
                  <ul>
                    <li><i class="pi pi-align-justify" style="color: var(--primary-color)"></i> &nbsp; <b>Descripción: </b></li>
                    <li><i class="pi pi-qrcode" style="color: var(--primary-color)"></i> &nbsp; <b>Código QR: </b></li>
                    <li><i class="pi pi-wifi" style="color: var(--primary-color)"></i> &nbsp; <b>Estado en linea: </b></li>
                    <li><i class="pi pi-bookmark" style="color: var(--primary-color)"></i> &nbsp; <b>Modelo: </b></li>
                    <li><i class="pi pi-sort-alt" style="color: var(--primary-color)"></i> &nbsp; <b>Tasa de Carga: </b></li>
                    <li><i class="pi pi-map-marker" style="color: var(--primary-color)"></i> &nbsp; <b>Dirección: </b></li>
                    <li><i class="pi pi-building" style="color: var(--primary-color)"></i> &nbsp; <b>Publico: </b></li>
                    <li><i class="pi pi-info-circle" style="color: var(--primary-color)"></i> &nbsp; <b>Estado: </b></li>
                  </ul>
                </div>
                <div class="col-6" style="text-align: left;">
                  <ul>
                    <li><label [pTooltip]="item.descripcion" tooltipPosition="bottom" >{{item.descripcion | truncate:15}}</label></li>
                    <li><label>{{item.codeStationQr}}</label></li>
                    <li>
                      <label>{{item.stationConnectivityStatus | formatOnlineOffline}}</label>                    
                    </li>
                    <li><label>{{item.modelVendor}}</label></li>
                    <li><label>{{item.chargeRateAmount}}</label></li>
                    <li><label [pTooltip]="item.direccion" tooltipPosition="bottom" >{{item.direccion | truncate:15}}</label></li>
                    <li><label>{{item.ocppPublicAccessAllowed | formatSiNo}}</label></li>
                    <li>
                      <p-button size="small" *ngIf="item.chargingConnectorStatus == 'DISPONIBLE'" label="Disponible" [raised]="true"
                        severity="success" (click)="onVerTodasElectrolineras(item.id)"></p-button>
                      <p-button size="small" *ngIf="item.chargingConnectorStatus == 'OCUPADO'" label="Ocupado" [raised]="true"
                        severity="warning" (click)="onVerTodasElectrolineras(item.id)"></p-button>
                      <p-button size="small" *ngIf="item.chargingConnectorStatus == 'NoConnector'" label="Sin Conectores"
                        [raised]="true" severity="secondary" (click)="onVerTodasElectrolineras(item.id)"></p-button>
                      <p-button size="small" *ngIf="item.chargingConnectorStatus == 'BLOQUEADO'" label="Bloqueado" [raised]="true"
                        severity="danger" (click)="onVerTodasElectrolineras(item.id)"></p-button>
                    </li>
                  </ul>
                </div>
              </div>
            </div>
            <ng-template pTemplate="footer">
              <p-button label="Mas Información" [text]="true" icon="pi pi-chevron-right"
                (click)="onVerTodasElectrolineras(item.id)"></p-button>
            </ng-template>
          </p-card>
        </div>
      </div>
    </div>
  </p-card>
</div>
