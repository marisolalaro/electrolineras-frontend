<body>
  <p-toast></p-toast>
  <div class="upper">
    <div class="login-div">

      <form class="login" [formGroup]="loginForm">
        <img src="../../../assets/img/delapaz2.png" alt="delapaz" width="100%">
        <h4>SISTEMA DE GESTIÓN DE ELECTROLINERAS</h4>
        <div class="input-text">
          <input type="text" id="inputEmail" name="email" placeholder="Email or phone number"
            formControlName="username" />
          <div class="warning-input" id="warningEmail">
            Please enter a valid email or phone number.
          </div>
        </div>
        <div class="input-text">
          <input type="password" id="inputPassword" name="password" placeholder="Password" formControlName="password" />
          <div class="warning-input" id="warningPassword">
            Your password must contain between 4 and 60 characters.
          </div>
        </div>
        <div>
          <button class="signin-button" (click)="onIniciaSesion()">Iniciar Sesión</button>
        </div>
      </form>

    </div>
  </div>
</body>
