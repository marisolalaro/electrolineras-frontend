<div class="container">
  <section class="listado">
    <h3>{{titleProduct.mainTitle}}</h3>

    <p-table #dt1 [columns]="cols" [value]="electricStations" dataKey="id"
      styleClass="p-datatable-gridlines p-datatable-striped" [paginator]="false" [rows]="5"
      [showCurrentPageReport]="false" [rowsPerPageOptions]="[5,10,20]" paginatorLocale="es-ES">

      <ng-template pTemplate="header" let-columns>
        <tr>
          <th *ngFor="let col of columns" pSortableColumn="{{col.field}}">
            {{col.header}}
            <p-sortIcon field="{{col.field}}"></p-sortIcon>
          </th>
        </tr>

        <tr>
          <th *ngFor="let col of columns" [ngSwitch]="col.field">
            <input *ngSwitchCase="'nameStation'" pInputText type="text" (input)="applyFilter($event, 'nameStation', 'contains')"
              placeholder="Busca por Nombre" class="w-full">

            <input *ngSwitchCase="'direccion'" pInputText type="text"
              (input)="applyFilter($event, 'direccion', 'contains')" placeholder="Busca por Dirección" class="w-full">

            <input *ngSwitchCase="'descripcion'" pInputText type="text"
              (input)="applyFilter($event, 'descripcion', 'contains')" placeholder="Busca por Descripcón"
              class="w-full">

          </th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-rowData let-columns="columns">
        <tr>
          <td *ngFor="let col of columns">
            <div *ngIf="col.field != '';then normal_content else icon_content"></div>
            <ng-template #normal_content>
              {{rowData[col.field]}}
            </ng-template>
            <ng-template #icon_content>
              <i class="pi pi-pencil" style="font-size: 1.5rem; color: #3498db;" data-bs-toggle="modal"
                data-bs-target="#editModal" (click)="onSelecetedEdit(rowData)"></i> &nbsp;
              <i class="pi pi-map-marker" style="font-size: 1.5rem; color: #F51D1E;" data-bs-toggle="modal"
                data-bs-target="#exampleModal" (click)="onVerMapa(rowData)"></i>
            </ng-template>
          </td>
        </tr>
      </ng-template>
    </p-table>

    <!-- Paginador -->
    <div class="card flex justify-content-center">
      <p-paginator (onPageChange)="onPageChange($event)" [first]="page" [rows]="itemsPerPage"
        [totalRecords]="totalRecords" [rowsPerPageOptions]="[5, 10, 20]" >
      </p-paginator>
    </div>
    <!-- Paginador -->
  </section>
</div>
