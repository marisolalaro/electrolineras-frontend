<div class="container">
  <section class="listado">
    <h3>{{titleProduct.mainTitle}}</h3>

    <div class="table-responsive">
      <table class="table table-success table-striped-columns">
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">Nombre</th>
            <th scope="col">Direccion</th>
            <th scope="col">Descripcion</th>
            <!-- <th scope="col">Ubicacion</th> -->
            <th scope="col">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr class="table"
            *ngFor="let item of electricStations | paginate: {itemsPerPage: itemsPerPage, currentPage: page}; let i = index">
            <th scope="row">{{i + 1}}</th>
            <td>{{item.nameStation}}</td>
            <td>{{item.descripcion}}</td>
            <td>{{item.direccion}}</td>
            <!-- <td>{{item.latitude}}</td> -->
            <td>
              <i class="bi bi-pencil-fill" style="font-size: 1.5rem; color: #3498db;" data-bs-toggle="modal"
                data-bs-target="#exampleModal" (click)="onSelecetedItem(item)"></i> &nbsp;
              <i class="bi bi-geo-alt-fill" style="font-size: 1.5rem; color: #F51D1E;" data-bs-toggle="modal"
                data-bs-target="#exampleModal" (click)="onVerMapa(item)"></i>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="flex">
      <span class="block mt-2 md:mt-0 p-input-icon-left">
        <select class="form-select" name="codBaja" (change)="seleccionaSizeList($event)">
          <option selected [value]=10>10</option>
          <option [value]=15>15</option>
          <option [value]=20>20</option>
        </select>
      </span>
      <pagination-controls (pageChange)="page = $event"></pagination-controls>
    </div>
  </section>
