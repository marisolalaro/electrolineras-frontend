<p-confirmDialog [style]="{ width: '50vw' }"></p-confirmDialog>

<div class="container p-2">
  <div class="card shadow-2 border-round-xl overflow-hidden">
    
    <div class="text-center mb-3 py-3 border-bottom-1 border-300" style="background: var(--surface-section);">
      <h1 class="siat-title m-0 uppercase">
         <i class="icon-title"></i>
        {{componentTitle.mainTitle}}
      </h1>
      <p class="siat-subtitle m-0 text-600 font-medium">Gestión de Ubicaciones Geográficas</p>
    </div>

    <div class="px-4 pb-4">
      <div class="flex justify-content-between align-items-center mb-3">
        <div class="flex gap-2">
          <button pButton label="Limpiar Filtros" class="p-button-outlined p-button-sm" 
                  icon="pi pi-filter-slash" (click)="clearFilters(dt1); getAllAddress()"></button>
        </div>
        <div class="flex gap-2">
          <p-button icon="pi pi-refresh" [rounded]="true" (click)="getAllAddress()" 
                    pTooltip="Actualizar" tooltipPosition="left" severity="secondary"></p-button>
          
          <button pButton pRipple icon="pi pi-plus" label="Nuevo Registro" 
                  class="p-button-raised shadow-2" style="background: #0a3364; border: none;"
                  (click)="openDialogCreate()">
          </button>
        </div>
      </div>

      <p-table responsiveLayout="stack" #dt1 [value]="addresses" dataKey="id"
               styleClass="p-datatable-gridlines p-datatable-striped p-datatable-sm shadow-1" 
               [paginator]="true" [rows]="10" [showCurrentPageReport]="true"
               currentPageReportTemplate="Mostrando {first} a {last} de {{totalRecords}} registros">
        
        <ng-template pTemplate="header">
          <tr>
            <th class="text-center" style="width:8%">#</th>
            <th pSortableColumn="city">Ciudad <p-sortIcon field="city"></p-sortIcon></th>
            <th pSortableColumn="district">Distrito / Zona <p-sortIcon field="district"></p-sortIcon></th>
            <th class="text-center" style="width:12%">Opciones</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-rowData let-rowIndex="rowIndex">
          <tr>
            <td class="text-center font-bold text-600">{{rowIndex + 1}}</td>
            <td class="font-bold uppercase" style="color: var(--primary-color);">
              <i class="pi pi-map-marker mr-2 text-blue-500"></i>{{rowData['city']}}
            </td>
            <td class="text-sm uppercase font-medium">{{rowData['district']}}</td>
            <td class="text-center">
              <i class="pi pi-pencil text-blue-700 cursor-pointer hover:scale-125 transition-all" 
                 (click)="selectedEdit(rowData)" pTooltip="Editar Ubicación"></i>
            </td>
          </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="4" class="text-center py-4 text-500">No se encontraron registros.</td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>

<p-dialog 
  [header]="formRegistro.get('id')?.value ? titlesGlobales.edit : titlesGlobales.create" 
  [(visible)]="dialogRegistro" 
  (onHide)="dialogRegistro = false"
  [style]="{width: '450px'}" 
  [modal]="true" 
  styleClass="p-fluid"
  [draggable]="false"
  [resizable]="false">
  
  <ng-template pTemplate="content">
    <form [formGroup]="formRegistro" autocomplete="off" class="mt-3">
      <div class="field mb-4">
        <label for="city" class="block font-bold mb-2">Ciudad</label>
        <input type="text" pInputText id="city" formControlName="city" 
               placeholder="EJ. LA PAZ"
               (input)="formRegistro.get('city').setValue($any($event.target).value.toUpperCase())"
               [ngClass]="{'ng-invalid ng-dirty': submitted && formRegistro.controls['city'].invalid}" />
      </div>

      <div class="field mb-2">
        <label for="district" class="block font-bold mb-2">Distrito / Zona</label>
        <input type="text" pInputText id="district" formControlName="district" 
               placeholder="EJ. SOPOCACHI"
               (input)="formRegistro.get('district').setValue($any($event.target).value.toUpperCase())"
               [ngClass]="{'ng-invalid ng-dirty': submitted && formRegistro.controls['district'].invalid}" />
      </div>
    </form>
  </ng-template>

  <ng-template pTemplate="footer">
    <button pButton pRipple label="Cancelar" icon="pi pi-times" 
            class="p-button-text p-button-secondary" (click)="actionDialog(false, 'create')"></button>
    <button pButton pRipple label="Guardar Registro" icon="pi pi-check" 
            class="p-button-raised" style="background: #0a3364; border: none;"
            (click)="onValidaFormulario()"></button>
  </ng-template>
</p-dialog>

<p-toast></p-toast>

<p-blockUI [blocked]="loading">
    <div class="loading-overlay">
        <i class="pi pi-spin pi-spinner" style="font-size: 3rem"></i>
        <p class="font-bold">CARGANDO...</p>
    </div>
</p-blockUI>
