<p-toolbar>
	<ng-template pTemplate="left">
		<h3>{{titleCategory.secondaryTitle}}</h3>
	</ng-template>
	<ng-template pTemplate="right">
		<div class="text-right">
			<span class="p-input-icon-left">
			<i class="pi pi-search"></i>
			<input
				pInputText
				type="text"
				#filter
				(input)="onGlobalFilter(dt1, $event)"
				[placeholder]="messages.searchCurrentView"
				class="w-full"
			/>
			</span>
		</div>
		<button
			pButton
			pRipple
			type="button"
			icon="pi pi-sync"
			class="p-button-outlined p-button-secondary button-reload ml-2"
			(click)="reload()"
			[pTooltip]="tooltip.reload"
			tooltipPosition="top"
		></button>
	</ng-template>
</p-toolbar>
<p-table
	#dt1
	[value]="categories"
	dataKey="id"
	selectionMode="single"
	[(selection)]="selectedCategories"
	[rows]="5"
	[showCurrentPageReport]="true"
	[rowsPerPageOptions]="[5, 10, 15]"
	[rowHover]="true"
	styleClass="p-datatable-sm p-datatable-gridlines"
	[paginator]="true"
	[globalFilterFields]="['name','code','description']"
	responsiveLayout="scroll"
	currentPageReportTemplate="Mostrando {first} de {last} de {totalRecords} registros"
	[(first)]="firstPage"
	(onRowSelect)="onRowSelect($event)"
	(onRowUnselect)="onRowUnselect($event)"
	>
	<ng-template pTemplate="header">
		<tr>
			<th pSortableColumn="name">{{labels.name}}<p-sortIcon field="name"></p-sortIcon></th>
			<th pSortableColumn="description">{{labels.description}}<p-sortIcon field="description"></p-sortIcon></th>
			<th pSortableColumn="createdAt">{{labels.createdAt}}<p-sortIcon field="createdAt"></p-sortIcon></th>
		</tr>
	</ng-template>
	<ng-template pTemplate="body" let-category rowIndex="rowIndex">
		<tr [pSelectableRow]="category">
			<td>{{category.name}}</td>
			<td>{{category.description}}</td>
			<td>{{category.createdAt | formatFieldDate}}</td>
		</tr>
	</ng-template>
	<ng-template pTemplate="emptymessage">
		<tr>
			<td colspan="8">{{messages.emptyMessage}}</td>
		</tr>
	</ng-template>
	<ng-template pTemplate="loadingbody">
		<tr>
			<td colspan="8">{{messages.loadingRegisters}}</td>
		</tr>
	</ng-template>
</p-table>
