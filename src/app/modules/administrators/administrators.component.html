<div class="container">
  <section class="titulo">
    <h3>{{componentTitle.mainTitle}}</h3>
  </section>
  <section class="listado">
    <p-button label="Nuevo Registro" (click)="dialogRegistro = true"></p-button>

    <p-table [value]="administradors" [paginator]="true" [rows]="5" [showCurrentPageReport]="true"
      [tableStyle]="{ 'min-width': '50rem' }"
      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
      [rowsPerPageOptions]="[5, 10, 20]">
      <ng-template pTemplate="header">
        <tr>
          <th style="width:25%">Usuario</th>
          <th style="width:25%">Nombres</th>
          <th style="width:25%">Apellido Paterno</th>
          <th style="width:25%">Apellido Materno</th>
          <th style="width:25%">Email</th>
          <th style="width:25%">Celular</th>
          <th style="width:25%">Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-administrator>
        <tr>
          <td>{{ administrator.userName }}</td>
          <td>{{ administrator.names }}</td>
          <td>{{ administrator.lastName }}</td>
          <td>{{ administrator.motherLastName }}</td>
          <td>{{ administrator.electronicMail }}</td>
          <td>{{ administrator.cellPhoneNumber }}</td>
          <td>
            <i class="pi pi-pencil" style="font-size: 1.5rem; color: #3498db;" data-bs-toggle="modal"
              data-bs-target="#editModal" (click)="onSelecetedEdit(administrator)"></i> &nbsp;
          </td>
        </tr>
      </ng-template>
    </p-table>
  </section>
