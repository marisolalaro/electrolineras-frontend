<p-confirmDialog [style]="{width: '50vw'}"></p-confirmDialog>

<div class="container p-2">
  <div class="card shadow-2 border-round-xl overflow-hidden">
    
    <div class="text-center mb-3 py-3 border-bottom-1 border-300" style="background: var(--surface-section);">
      <h1 class="siat-title m-0 uppercase">
        {{componentTitle.mainTitle}}
      </h1>
      <p class="siat-subtitle m-0 text-600 font-medium">Gestión de Usuarios y Accesos al Sistema</p>
    </div>

    <div class="px-4 pb-4">
      <div class="flex justify-content-between align-items-center mb-3">
        <div class="flex gap-2">
          <button pButton label="Limpiar Filtros" class="p-button-outlined p-button-sm" 
                  icon="pi pi-filter-slash" (click)="clearFilters(dt1); getAllAdministrations()"></button>
        </div>
        <div class="flex gap-2">
          <p-button icon="pi pi-refresh" [rounded]="true" (click)="getAllAdministrations()" 
                    pTooltip="Actualizar" severity="secondary"></p-button>
          
          <button *ngIf="esSuperAdmin" pButton pRipple icon="pi pi-user-plus" label="Nuevo Usuario" 
                  class="p-button-raised shadow-2" style="background: #0a3364; border: none;"
                  (click)="openDialog(true, false, 'crear')">
          </button>
        </div>
      </div>

      <p-table responsiveLayout="stack" #dt1 [value]="administradors" dataKey="id"
               styleClass="p-datatable-gridlines p-datatable-striped p-datatable-sm shadow-1" 
               [paginator]="true" [rows]="10" [showCurrentPageReport]="true"
               currentPageReportTemplate="Mostrando {first} a {last} de {{totalRecords}} registros">
        
        <ng-template pTemplate="header">
          <tr>
            <th class="text-center" style="width:5%" rowspan="2">#</th>
            <th pSortableColumn="username">Usuario <p-sortIcon field="username"></p-sortIcon></th>
            <th pSortableColumn="electronicMail">Correo Electrónico <p-sortIcon field="electronicMail"></p-sortIcon></th>
            <th class="text-center" pSortableColumn="cellPhoneNumber" style="width:12%">Celular <p-sortIcon field="cellPhoneNumber"></p-sortIcon></th>
            <th class="text-center" pSortableColumn="enabled" style="width:12%" rowspan="2">Estado</th>
            <th class="text-center" style="width:10%" rowspan="2">Opciones</th>
          </tr>
          <tr>
            <th><input pInputText type="text" (input)="applyFilter($event, 'username', 'contains')" placeholder="Usuario" class="w-full p-inputtext-sm" [(ngModel)]="username"></th>
            <th><input pInputText type="text" (input)="applyFilter($event, 'electronicMail', 'contains')" placeholder="Email" class="w-full p-inputtext-sm" [(ngModel)]="electronicMail"></th>
            <th><input pInputText type="text" (input)="applyFilter($event, 'cellPhoneNumber', 'contains')" placeholder="Celular" class="w-full p-inputtext-sm" [(ngModel)]="cellPhoneNumber"></th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-rowData let-rowIndex="rowIndex">
          <tr>
            <td class="text-center font-bold text-600">{{rowIndex + 1}}</td>
            <td class="font-bold uppercase" style="color: var(--primary-color);">{{rowData['username']}}</td>
            <td class="text-sm">{{rowData['electronicMail']}}</td>
            <td class="text-center text-sm">{{rowData['cellPhoneNumber']}}</td>
            <td class="text-center">
              <div class="flex flex-column align-items-center gap-1">
                <p-inputSwitch *ngIf="esSuperAdmin" [(ngModel)]="rowData['enabled']" (onChange)="confirmSwitchChange($event, rowData)"></p-inputSwitch>
                <span class="text-xs font-bold" [ngClass]="rowData['enabled'] ? 'text-green-600' : 'text-red-500'">
                  {{rowData['enabled'] ? 'HABILITADO' : 'DESHABILITADO'}}
                </span>
              </div>
            </td>
            <td class="text-center">
              <i class="pi pi-user-edit text-blue-700 cursor-pointer hover:scale-125 transition-all" 
                 (click)="onSelecetedEdit(rowData)" pTooltip="Editar Perfil"
                 *ngIf="esSuperAdmin || userLogin.id == rowData['id']"></i>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>

<p-dialog [header]="titlesGlobales.create" [(visible)]="dialogRegistro" (onHide)="dialogRegistro=false" [style]="{width: '450px'}" [modal]="true" styleClass="p-fluid">
    <ng-template pTemplate="content">
        <form [formGroup]="formRegistro" autocomplete="off" class="p-fluid mt-3">
            <div class="field mb-3">
                <label class="font-bold">Nombre de Usuario</label>
                <input type="text" pInputText formControlName="username">
            </div>
            </form>
    </ng-template>
    <ng-template pTemplate="footer">
        <button pButton label="Cancelar" icon="pi pi-times" (click)="dialogRegistro=false" class="p-button-text p-button-secondary"></button>
        <button pButton label="Guardar" icon="pi pi-check" style="background: #0a3364; border: none;" (click)="onValidaFormulario()"></button>
    </ng-template>
</p-dialog>

<p-blockUI [blocked]="loading">
    <div class="loading-overlay">
        <i class="pi pi-spin pi-spinner" style="font-size: 3rem"></i>
        <p class="font-bold">CARGANDO...</p>
    </div>
</p-blockUI>
